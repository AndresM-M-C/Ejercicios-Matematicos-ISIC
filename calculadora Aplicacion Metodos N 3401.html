<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Métodos Numéricos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-7 border border-slate-200">
        <h1 class="text-2xl font-black text-center text-slate-800 mb-6 uppercase tracking-tighter">Analizador Numérico
        </h1>

        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 mb-1 ml-2 uppercase">Ecuación (Ej: 2x^2 +
                    5x)</label>
                <input id="formula" type="text" inputmode="text" autocorrect="off" autocapitalize="none"
                    spellcheck="false"
                    class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-lg font-mono focus:border-blue-500 outline-none transition-all">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <label class="block text-[9px] font-bold text-slate-400 uppercase">Inicio (a)</label>
                    <input id="limA" type="number" value="0"
                        class="w-full bg-transparent text-lg font-bold outline-none">
                </div>
                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <label class="block text-[9px] font-bold text-slate-400 uppercase">Fin (b)</label>
                    <input id="limB" type="number" value="1"
                        class="w-full bg-transparent text-lg font-bold outline-none">
                </div>
            </div>

            <div class="flex gap-3">
                <div class="w-1/3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <label class="block text-[9px] font-bold text-slate-400 uppercase">n</label>
                    <input id="nIntervalos" type="number" value="6"
                        class="w-full bg-transparent text-lg font-bold outline-none">
                </div>
                <select id="metodo"
                    class="flex-1 p-3 bg-slate-800 rounded-2xl text-white font-bold outline-none appearance-none text-center">
                    <option value="trapecio">Trapecio</option>
                    <option value="simpson13">Simpson 1/3</option>
                    <option value="simpson38">Simpson 3/8</option>
                </select>
            </div>

            <button onclick="resolver()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl text-xl shadow-lg shadow-blue-200 active:scale-95 transition-all uppercase">
                Calcular Resultado
            </button>
        </div>

        <div id="resultadoBox" class="mt-8 hidden border-t-2 border-slate-50 pt-6">
            <p class="text-center text-[10px] font-bold text-slate-400 uppercase mb-1">Aproximación por método</p>
            <div id="valorResultado" class="text-5xl font-black text-center text-slate-900 mb-4 tracking-tighter"></div>

            <div id="statusProceso" class="p-4 rounded-2xl border">
                <p id="tituloMetodo" class="text-[10px] font-black uppercase mb-1"></p>
                <div id="procesoTexto" class="text-xs font-medium leading-relaxed"></div>
            </div>
        </div>
    </div>

    <script>
        function corregirEntrada(t) {
            let res = t.toLowerCase().replace(/\s+/g, '');
            // Manejo de potencia nativo: convierte x2 en x^2 si el usuario olvida el ^
            res = res.replace(/([a-z])(\d)/g, '$1^$2');
            // Multiplicación implícita: 2x -> 2*x
            res = res.replace(/(\d)([a-z])/g, '$1*$2');
            return res;
        }

        function resolver() {
            const raw = document.getElementById('formula').value;
            const a = parseFloat(document.getElementById('limA').value);
            const b = parseFloat(document.getElementById('limB').value);
            const n = parseInt(document.getElementById('nIntervalos').value);
            const metodo = document.getElementById('metodo').value;

            if (!raw) return;

            try {
                const formulaLimpia = corregirEntrada(raw);
                const f = (x) => math.evaluate(formulaLimpia, { x: x });
                const h = (b - a) / n;
                let integral = 0;
                let detalle = "";
                let colorBase = "";

                if (metodo === "trapecio") {
                    let suma = (f(a) + f(b)) / 2;
                    for (let i = 1; i < n; i++) suma += f(a + i * h);
                    integral = h * suma;
                    detalle = `Aproximación lineal simple por cada trapecio. h=${h.toFixed(3)}`;
                    colorBase = "bg-orange-50 border-orange-100 text-orange-800";
                    document.getElementById('tituloMetodo').innerText = "Método del Trapecio";
                }
                else if (metodo === "simpson13") {
                    if (n % 2 !== 0) throw "N debe ser PAR";
                    let suma = f(a) + f(b);
                    for (let i = 1; i < n; i++) suma += (i % 2 === 0 ? 2 : 4) * f(a + i * h);
                    integral = (h / 3) * suma;
                    detalle = `Aproximación parabólica. Se usaron pesos 4 y 2.`;
                    colorBase = "bg-blue-50 border-blue-100 text-blue-800";
                    document.getElementById('tituloMetodo').innerText = "Simpson 1/3";
                }
                else if (metodo === "simpson38") {
                    if (n % 3 !== 0) throw "N debe ser Múltiplo de 3";
                    let suma = f(a) + f(b);
                    for (let i = 1; i < n; i++) suma += (i % 3 === 0 ? 2 : 3) * f(a + i * h);
                    integral = (3 * h / 8) * suma;
                    detalle = `Aproximación cúbica. Mayor precisión en curvas complejas.`;
                    colorBase = "bg-purple-50 border-purple-100 text-purple-800";
                    document.getElementById('tituloMetodo').innerText = "Simpson 3/8";
                }

                // Mostramos diferencias sutiles redondeando a 5 decimales
                document.getElementById('valorResultado').innerText = integral.toFixed(5);
                document.getElementById('procesoTexto').innerHTML = detalle;
                document.getElementById('statusProceso').className = `p-4 rounded-2xl border ${colorBase}`;
                document.getElementById('resultadoBox').classList.remove('hidden');

            } catch (e) {
                alert("Error: " + e + ". Revisa la escritura.");
            }
        }
    </script>
</body>

</html>
